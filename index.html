<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Верстак — тренажёр SQL в браузере: подсказки по схеме и пошаговый разбор запроса."
    />
    <title>Верстак — тренажёр SQL</title>
    <script>
      try {
        const raw = JSON.parse(localStorage.getItem('verstak-ui') || '{}')
        const theme = raw.state && raw.state.theme
        const dark =
          theme === 'dark' ||
          ((theme === 'system' || !theme) &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
